<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background smooth gradient: Sky Blue to Coral Rose -->
    <linearGradient id="bg" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Gold Brass Gradient -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#facc15" />
      <stop offset="70%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <!-- Valve Highlight -->
    <linearGradient id="valveHl" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Mouthpiece Silver -->
    <linearGradient id="silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Rounded Squircle App Icon Base -->
  <rect width="64" height="64" rx="14" ry="14" fill="url(#bg)" />

  <!-- Centered Trumpet/Horn diagonally placed -->
  <g transform="translate(32, 32) rotate(-45) translate(-32, -32)" filter="url(#shadow)">
    <!-- Main Horn Bell Flare (expanding to the right) -->
    <path d="M 28 30 L 46 27 C 49 26 51 22 53 20 L 53 44 C 51 42 49 38 46 37 L 28 34 Z" fill="url(#gold)" />
    <!-- Bell Rim Oval -->
    <ellipse cx="53" cy="32" rx="2.5" ry="12" fill="url(#gold)" stroke="#ca8a04" stroke-width="0.8" />
    <ellipse cx="53" cy="32" rx="1.5" ry="9" fill="#ca8a04" opacity="0.6" />

    <!-- Lower Pipe Loop -->
    <path d="M 24 33 C 24 41 40 41 40 33" fill="none" stroke="url(#gold)" stroke-width="4.5" stroke-linecap="round" />

    <!-- Main Leadpipe -->
    <path d="M 14 32 L 32 32" fill="none" stroke="url(#gold)" stroke-width="4" stroke-linecap="round" />

    <!-- Valves (3 vertical pistons) -->
    <rect x="25" y="24" width="3" height="15" rx="1.2" fill="url(#valveHl)" stroke="#b45309" stroke-width="0.5" />
    <rect x="29" y="24" width="3" height="15" rx="1.2" fill="url(#valveHl)" stroke="#b45309" stroke-width="0.5" />
    <rect x="33" y="24" width="3" height="15" rx="1.2" fill="url(#valveHl)" stroke="#b45309" stroke-width="0.5" />

    <!-- Valve Caps (top buttons) -->
    <circle cx="26.5" cy="23.5" r="1.5" fill="#fef08a" />
    <circle cx="30.5" cy="23.5" r="1.5" fill="#fef08a" />
    <circle cx="34.5" cy="23.5" r="1.5" fill="#fef08a" />

    <!-- Silver Mouthpiece -->
    <path d="M 11 32 L 14 32" stroke="url(#silver)" stroke-width="3" stroke-linecap="butt" />
    <path d="M 8 30 L 11 31.5 L 11 32.5 L 8 34 Z" fill="url(#silver)" />
  </g>
</svg>
